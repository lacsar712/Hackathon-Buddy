services:
  mongo:
    image: docker.m.daocloud.io/library/mongo:7
    container_name: hackathon-buddy-mongo
    restart: unless-stopped
    ports:
      - "5031:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - app-network

  backend:
    build: ./server
    container_name: hackathon-buddy-backend
    restart: unless-stopped
    environment:
      PORT: 8031
      MONGO_URI: mongodb://mongo:27017/hackathon-buddy
      JWT_SECRET: hackathon_buddy_docker_secret
      CLIENT_URL: http://localhost:3031
      NODE_ENV: production
    ports:
      - "8031:8031"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3031
        VITE_SOCKET_URL: http://localhost:3031
    container_name: hackathon-buddy-frontend
    restart: unless-stopped
    ports:
      - "3031:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
